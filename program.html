<!doctype html><html lang="es"><meta charset="utf-8"><title>Piruleta Studio · Programa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;overflow:hidden;font-family:Arial;color:white}iframe,video,#end{position:absolute;width:100vw;height:100vh;inset:0;border:0;visibility:hidden}video{object-fit:contain;background:#11131d}#end{background:radial-gradient(ellipse at top,#432343,#14111e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}small{letter-spacing:8px;color:#ffcb61}h1{font-size:5vw;margin:0}#score{font-size:8vw;font-weight:bold}img{width:12vw;height:12vw;object-fit:contain}.teams{display:flex;align-items:center;gap:6vw}#error{display:none;position:fixed;bottom:16px;left:16px;background:#8a1530;padding:12px}
</style>
<style>#stats{background:#14111e}</style>
<iframe id="game" src="/overlay" title="Marcador"></iframe><iframe id="stats" src="/postmatch" title="Estadísticas"></iframe>
<video id="pre" muted playsinline preload="auto"></video><video id="victory0" muted playsinline preload="auto"></video><video id="victory1" muted playsinline preload="auto"></video>
<div id="end"><small>PIRULETA STUDIO</small><div class="teams"><img id="logo0"><b id="score"></b><img id="logo1"></div><h1 id="title">PREPARANDO LA SERIE</h1><span id="names"></span></div><div id="error"></div>
<script>
const $=id=>document.getElementById(id),ids=['game','stats','pre','victory0','victory1','end'];let revision=-1,phase='';
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error('Sin conexión');const s=await r.json();
for(const [id,url] of Object.entries(s.media)){const v=$(id);if(v.dataset.url!==url){v.dataset.url=url;v.src=url;v.load()}}
const p=s.studio.phase;for(const id of ids)$(id).style.visibility=(id===(p==='complete'?'end':p))?'visible':'hidden';
if(revision!==s.studio.revision){for(const id of ['pre','victory0','victory1']){const v=$(id);if(id===p){v.currentTime=0;v.play().catch(()=>{})}else v.pause()}revision=s.studio.revision;phase=p}
// Hold keeps the final frame on screen; extending a scene does not restart its animation.
const c=s.config,w=c.teams.map(t=>t.wins);$('score').textContent=w.join(' — ');$('title').textContent=s.series.complete?(s.series.tied?'SERIE EMPATADA':c.teams[w[0]>w[1]?0:1].name+' GANA LA SERIE'):'SERIE PREPARADA';$('names').textContent=c.teams.map(t=>t.name).join('  /  ');for(let i=0;i<2;i++)$('logo'+i).src=c.teams[i].logo||'/assets/torneo.png';$('error').style.display='none';
}catch(e){$('error').textContent='Sin conexión con Piruleta Studio';$('error').style.display='block'}setTimeout(poll,50)}poll();
</script></html>
