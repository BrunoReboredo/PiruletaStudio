<!doctype html><html lang="es"><meta charset="utf-8"><title>Piruleta - Overlay 0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:white;font-family:Arial,sans-serif;overflow:hidden}#stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;--pink:#fa54b7;--coral:#ff8875;--yellow:#ffd14c;--dark:#181426;--text:#ffffff}body.preview{background:#14121c}body.preview #stage{background:radial-gradient(ellipse at 50% 100%,#384444 0,transparent 60%),linear-gradient(150deg,#25263c,#12161e)}body.preview #stage:after{content:'VISTA PREVIA · SIN CAPTURA DEL JUEGO';position:absolute;top:570px;left:0;width:100%;text-align:center;font-size:20px;letter-spacing:6px;color:#ffffff35;z-index:-1}
.scoreboard{position:absolute;left:360px;top:24px;width:1200px;filter:drop-shadow(0 8px 18px #0006)}.eyebrow{height:32px;background:var(--dark);display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:3px;font-weight:700;border-top:3px solid var(--pink)}.main{display:flex;height:88px;align-items:stretch;background:var(--dark)}.team{display:flex;align-items:center;gap:18px;width:450px;padding:0 22px;background:linear-gradient(100deg,var(--pink),var(--coral));color:#171122}.team.right{background:linear-gradient(100deg,var(--coral),var(--yellow));flex-direction:row-reverse;text-align:right}.team img{height:60px;width:60px;object-fit:contain}.name{flex:1;font-size:25px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goals{font-size:58px;font-weight:900;min-width:50px;text-align:center}.clock{width:180px;flex-shrink:0;background:#fff;color:#191321;display:flex;align-items:center;justify-content:center;font-size:47px;font-weight:900;letter-spacing:-2px}.sub{display:flex;height:32px;align-items:center;justify-content:space-around;background:var(--dark);font-size:14px;letter-spacing:2px}.pips{display:flex;gap:6px;width:240px}.pips:last-child{justify-content:flex-end}.pip{width:34px;height:6px;background:#ffffff26}.pip.on{background:var(--pink)}.pips:last-child .on{background:var(--yellow)}.brand{position:absolute;left:50%;top:178px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:4px;color:#fff9}.brand img{width:38px;height:42px;object-fit:contain}.roster{position:absolute;top:235px;width:295px;display:flex;flex-direction:column;gap:9px}.roster.left{left:24px}.roster.right{right:24px}.player{padding:12px 16px 10px;background:var(--dark);border-left:3px solid var(--pink);box-shadow:0 4px 12px #0004}.right .player{border-left:0;border-right:3px solid var(--yellow)}.player.observed{background:#34233f}.playerline{display:flex;justify-content:space-between;font-size:17px;font-weight:700;gap:10px}.playerline span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:4px;background:#ffffff20;margin-top:9px}.bar i{display:block;height:100%;background:var(--pink);transition:width .15s}.right .bar i{background:var(--yellow)}.focus{position:absolute;bottom:36px;left:36px;width:440px;background:var(--dark);padding:18px 22px;border-bottom:4px solid var(--pink)}.focus small{font-size:11px;letter-spacing:3px;color:var(--pink)}.focus h2{font-size:26px;margin:8px 0 16px}.stats{display:flex;justify-content:space-between;gap:12px}.stat b{font-size:23px;display:block}.stat span{font-size:10px;letter-spacing:1px;color:#bbb}.boost{position:absolute;right:45px;bottom:40px;width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--yellow) calc(var(--boost)*1%),#ffffff18 0);padding:8px;box-shadow:0 0 35px #fa54b733}.boost div{border-radius:50%;background:var(--dark);height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:48px;font-weight:bold}.boost small{font-size:11px;letter-spacing:3px;color:var(--yellow)}.banner{position:absolute;top:370px;left:460px;width:1000px;text-align:center;padding:22px;background:var(--dark);border-top:4px solid var(--pink);font-size:32px;font-weight:900}.banner small{display:block;font-size:15px;letter-spacing:4px;margin-top:8px;color:var(--yellow)}.angular .main{clip-path:polygon(0 0,100% 0,97% 100%,3% 100%)}.rounded .main{border-radius:18px;overflow:hidden}.hidden{display:none!important}
</style><div id="stage"><div class="scoreboard" id="scoreboard"><div class="eyebrow" id="event"></div><div class="main"><div class="team"><img id="logo0"><span class="name" id="name0"></span><b class="goals" id="score0"></b></div><div class="clock" id="clock"></div><div class="team right"><img id="logo1"><span class="name" id="name1"></span><b class="goals" id="score1"></b></div></div><div class="sub"><div class="pips" id="series0"></div><span id="subtitle"></span><div class="pips" id="series1"></div></div></div><div class="brand" id="brand"><img src="/assets/torneo.png"><span id="brandname"></span></div><div class="roster left" id="players0"></div><div class="roster right" id="players1"></div><div class="focus" id="focus"></div><div class="boost" id="boost"><div><span id="boostvalue"></span><small>TURBO</small></div></div><div class="banner hidden" id="banner"></div></div>
<style>
.team{flex:1}
.player{background:var(--players0-bg,var(--dark));color:var(--players0-fg,var(--text))}
.right .player{background:var(--players1-bg,var(--dark));color:var(--players1-fg,var(--text))}
.player.observed{background:var(--players0-bg,var(--dark));box-shadow:inset 0 0 0 1px var(--pink),0 4px 12px #0004}
.right .player.observed{background:var(--players1-bg,var(--dark));box-shadow:inset 0 0 0 1px var(--yellow),0 4px 12px #0004}
.playerline .playerboost{font-size:21px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.right .playerline{flex-direction:row-reverse}
.right .playerline .playerboost{text-align:left}
.right .playerline .playername{text-align:right}
.bar{height:6px;background:#8884}.bar i{transition:none}.right .bar i{margin-left:auto}
.focus{background:var(--stats-bg,var(--dark));color:var(--stats-fg,var(--text))}
.focus small{color:var(--stats-accent,var(--pink))}.stat span{color:inherit;opacity:.75}
.boost div{background:var(--boost-bg,var(--dark));color:var(--boost-fg,var(--text))}
.boost{box-shadow:0 0 35px var(--boost-glow,#fa54b733)}.boost small{color:var(--boost-accent,var(--yellow))}
body.details #stage{width:1000px;height:390px}body.details .scoreboard,body.details .brand,body.details .roster,body.details .banner{display:none!important}
body.details #stage:after{content:'DATOS DE EJEMPLO · LA CONEXIÓN AL JUEGO SIGUE ACTIVA';top:320px;font-size:12px;letter-spacing:2px;z-index:auto}
body.details #stage:before{content:'PIRULETA / ESTADÍSTICAS Y TURBO';position:absolute;top:55px;left:60px;font-size:19px;letter-spacing:3px;color:#fa54b7}
body.details #focus{left:60px!important;top:135px!important;transform:none!important}body.details #boost{left:720px!important;top:112px!important;transform:scale(1.2)!important}
</style><style id="customstyle"></style><script src="/boost-animation.js"></script><script>
const $=id=>document.getElementById(id),stage=$('stage'),params=new URLSearchParams(location.search),preview=params.has('preview'),details=preview&&params.has('details');if(preview)document.body.classList.add('preview');if(details)document.body.classList.add('details');
function size(){stage.style.transform=`scale(${Math.min(innerWidth/(details?1000:1920),innerHeight/(details?390:1080))})`}onresize=size;size();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function boostValue(player){if(player.Boost!=null&&Number.isFinite(Number(player.Boost)))return Math.max(0,Math.min(100,Math.round(Number(player.Boost))));return ['bHasCar','Speed','bBoosting','bOnGround','bOnWall','bDemolished'].some(key=>key in player)?0:null}
function foreground(hex,fallback){const rgb=hex.replace('#','').match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.35?'#181426':fallback}
const boostTween=new BoostTween(200),playerCards=new Map();let observedBoostKey=null;
const playerKey=p=>`${p.TeamNum}:${p.Shortcut??p.PrimaryId??''}:${p.Name}`;
function reconcileRoster(team,players,target,now){
 const container=$('players'+team),ordered=[];
 for(const player of players){
  const key=playerKey(player);let card=playerCards.get(key);
  if(!card){const node=document.createElement('div');node.className='player';node.innerHTML='<div class="playerline"><span class="playername"></span><span class="playerboost"></span></div><div class="bar"><i></i></div>';card={node,name:node.querySelector('.playername'),value:node.querySelector('.playerboost'),bar:node.querySelector('.bar i')};playerCards.set(key,card)}
  card.name.textContent=player.Name;card.node.classList.toggle('observed',player.Name===target);boostTween.set(key,boostValue(player),now);ordered.push(card.node);
 }
 if(container.children.length!==ordered.length||ordered.some((node,index)=>container.children[index]!==node))container.replaceChildren(...ordered);
}
function animateBoosts(now){
 for(const [key,card] of playerCards){const value=boostTween.value(key,now),label=value===null?'—':String(Math.round(value));if(card.value.textContent!==label)card.value.textContent=label;card.bar.style.width=(value??0).toFixed(3)+'%'}
 if(observedBoostKey!==null){const value=boostTween.value(observedBoostKey,now),label=value===null?'—':String(Math.round(value));if($('boostvalue').textContent!==label)$('boostvalue').textContent=label;$('boost').style.setProperty('--boost',(value??0).toFixed(3))}
 requestAnimationFrame(animateBoosts);
}
requestAnimationFrame(animateBoosts);
function render(s){const c=s.config,m=s.match;for(const [key,v] of Object.entries(c.colors))stage.style.setProperty('--'+key,v);stage.style.color=c.colors.text;stage.style.fontFamily=c.font;stage.className=c.design;stage.style.opacity=c.opacity/100;
 for(const key of ['boost','stats','players0','players1']){const bg=c.colors[c.panel_colors?.[key]||'dark']||c.colors.dark,fg=foreground(bg,c.colors.text);stage.style.setProperty('--'+key+'-bg',bg);stage.style.setProperty('--'+key+'-fg',fg);stage.style.setProperty('--'+key+'-accent',bg.toLowerCase()===c.colors.dark.toLowerCase()?(key==='stats'?c.colors.pink:c.colors.yellow):fg)}stage.style.setProperty('--boost-glow',c.colors.pink+'33');
 $('scoreboard').style.left=c.x+'px';$('scoreboard').style.top=c.y+'px';$('scoreboard').style.transform=`scale(${c.scale/100})`;$('scoreboard').style.transformOrigin='top center';
 $('customstyle').textContent=c.custom_css||'';for(const [id,v] of Object.entries(c.panels||{})){const el=$(id);el.style.left=v[0]+'px';el.style.top=v[1]+'px';el.style.right='auto';el.style.bottom='auto';el.style.transform='scale('+v[2]/100+')';el.style.transformOrigin='top left';}
 const series=s.series||{slots:Math.floor(c.bestof/2)+1};
 $('event').textContent=c.event;$('brandname').textContent=c.event;$('subtitle').textContent=`${c.round} · ${series.complete?(series.tied?'EMPATE':'SERIE FINALIZADA'):'PARTIDO '+c.game} / BO${c.bestof}`;
 for(let t=0;t<2;t++){$('name'+t).textContent=c.teams[t].name;$('score'+t).textContent=m.scores[t];const logo=$('logo'+t),logoSrc=c.teams[t].logo||'/assets/torneo.png';if(logo.getAttribute('src')!==logoSrc)logo.src=logoSrc;logo.classList.toggle('hidden',!c.show_logos);$('series'+t).innerHTML=Array.from({length:series.slots},(_,i)=>`<i class="pip ${i<c.teams[t].wins?'on':''}"></i>`).join('');
 reconcileRoster(t,m.players.filter(p=>p.TeamNum===t).sort((a,b)=>(a.Shortcut??0)-(b.Shortcut??0)),m.target,performance.now());$('players'+t).classList.toggle('hidden',!c.show_players)}
 const activeKeys=new Set(m.players.map(playerKey));for(const key of playerCards.keys()){if(!activeKeys.has(key))playerCards.delete(key)}boostTween.retain(activeKeys);
 const sec=Math.abs(Math.floor(m.time));$('clock').textContent=(m.overtime?'+':'')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
 const p=m.players.find(p=>p.Name===m.target);observedBoostKey=p?playerKey(p):null;$('focus').classList.toggle('hidden',!c.show_stats||!p);$('boost').classList.toggle('hidden',!c.show_boost||!p);if(p){$('focus').innerHTML=`<small>JUGADOR EN CÁMARA</small><h2>${esc(p.Name)}</h2><div class="stats">${[['Score','PUNTOS'],['Goals','GOLES'],['Shots','TIROS'],['Assists','ASIST.'],['Saves','SALVADAS']].map(([k,n])=>`<div class="stat"><b>${esc(p[k]??'—')}</b><span>${n}</span></div>`).join('')}</div>`;}
 $('brand').classList.toggle('hidden',!c.show_brand);$('banner').classList.toggle('hidden',!m.banner||!c.show_events);$('banner').textContent=m.banner||'';
}
async function poll(){try{const r=await fetch(preview?'/preview-state':'/state',{cache:'no-store'});render(await r.json())}catch(e){}setTimeout(poll,100)}poll();
</script></html>
