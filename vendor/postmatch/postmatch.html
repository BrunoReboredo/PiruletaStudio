<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Piruleta - Estadísticas</title><link rel="icon" type="image/png" href="/assets/pluma.png">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;overflow:hidden;color:white;font-family:Arial,sans-serif}
#stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;--pink:#fa54b7;--coral:#ff8875;--yellow:#ffd14c;--dark:#181426;--text:#fff}
body.preview{background:#100e18}.sheet{position:absolute;inset:90px 100px 90px;background:var(--dark);box-shadow:0 25px 100px #0007;overflow:hidden;animation:enter .65s cubic-bezier(.2,.7,.2,1) both}
.sheet:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,var(--pink),transparent 38%,transparent 62%,var(--yellow));opacity:.06;pointer-events:none}
.angular .sheet{clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}.rounded .sheet{border-radius:24px}
.eyebrow{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;font-size:14px;font-weight:700;letter-spacing:3px;border-top:3px solid var(--pink);background:#0002}.eyebrow span:last-child{color:var(--coral)}
.headline{display:flex;height:126px;position:relative}.team{display:flex;align-items:center;gap:24px;flex:1;min-width:0;padding:18px 32px;background:linear-gradient(105deg,var(--pink),var(--coral));color:#181426}.team.right{flex-direction:row-reverse;text-align:right;background:linear-gradient(105deg,var(--coral),var(--yellow))}.team img{width:80px;height:80px;object-fit:contain}.identity{flex:1;min-width:0}.identity small{display:block;font-size:11px;letter-spacing:3px;font-weight:800;margin-bottom:8px}.identity h1{font-size:31px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.score{font-size:76px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.versus{background:#fff;color:#181426;display:flex;flex-direction:column;justify-content:center;align-items:center;width:184px;flex:none;gap:8px}.versus b{font-size:24px;letter-spacing:3px}.versus span{font-size:12px;font-weight:800;letter-spacing:2px}
.series{height:49px;display:flex;align-items:center;justify-content:center;gap:24px;background:#0002;font-size:13px;font-weight:700;letter-spacing:2px}.series em{font-size:20px;font-style:normal;color:var(--coral);font-variant-numeric:tabular-nums}
.table{position:relative;padding:14px 42px 0}.grid{display:grid;grid-template-columns:repeat(var(--team-size,3),minmax(0,1fr)) 240px repeat(var(--team-size,3),minmax(0,1fr));align-items:center;text-align:center}.names{height:122px}.player{position:relative;min-width:0;padding:20px 7px 22px;font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:3px solid var(--pink)}.player.right{border-color:var(--yellow)}.player.top{color:var(--pink)}.player.top.right{color:var(--yellow)}.award{position:absolute;top:0;left:0;width:100%;font-size:9px;letter-spacing:1.4px;font-weight:700}.names .label{font-size:10px;letter-spacing:3px;color:var(--text);opacity:.45}
.row{height:68px;border-bottom:1px solid #ffffff0c;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}.value{opacity:.9}.value.best{opacity:1}.label{font-size:15px;letter-spacing:2px;color:var(--text);font-weight:700}.compare{display:flex;height:3px;margin:12px 20px 0;background:#ffffff18;position:relative}.compare:after{content:'';position:absolute;height:9px;width:2px;left:var(--share);top:-3px;background:#fff}.compare i{background:var(--pink);width:var(--share)}.compare b{background:var(--yellow);flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;position:absolute;bottom:0;left:0;right:0;height:68px;padding:0 42px;font-size:11px;letter-spacing:3px;color:var(--text)}.foot span{opacity:.5}.foot b{font-weight:700;color:var(--coral)}.hidden{display:none!important}
/* Fill the OBS canvas and distribute statistics across its full height. */
.sheet{inset:0;display:flex;flex-direction:column;box-shadow:none}
.angular .sheet,.rounded .sheet{clip-path:none;border-radius:0}
.eyebrow{height:56px;flex-shrink:0}
.headline{height:156px;flex-shrink:0}
.series{height:60px;flex-shrink:0}
.table{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 42px 0}
.names{height:140px;flex-shrink:0}
#rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr))}
.row{height:auto;font-size:36px}
.label{font-size:17px}
.foot{position:static;height:74px;flex-shrink:0}

#rows.compact{display:flex;flex-direction:column;justify-content:center}
#rows.compact .row{height:96px;flex-shrink:0}
.label small{display:block;font-size:10px;letter-spacing:1px;margin-top:6px;opacity:.7}
.value{position:relative;margin:0 14px;padding:10px 8px;overflow:hidden}
.value span{position:relative;z-index:1}
.player-fill{position:absolute;left:0;top:0;bottom:0;background:var(--pink);opacity:.2;border-left:3px solid var(--pink)}
.player-fill.right{background:var(--yellow);border-color:var(--yellow)}
.textvalue{font-size:15px;line-height:1.4;max-height:84px}

#stage{opacity:0;transition:opacity 500ms ease;--overlay-opacity:1}
#stage.is-visible{opacity:var(--overlay-opacity)}
.sheet{animation:none}
.credit{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px;letter-spacing:1px;font-size:12px}
.credit span{opacity:.8}.credit strong{color:var(--coral);font-size:14px}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
<div id="stage" class="hidden"><section class="sheet"><div class="eyebrow"><span id="event"></span><span id="round"></span></div><header class="headline"><div class="team"><img id="logo0"><div class="identity"><small id="status0"></small><h1 id="name0"></h1></div><b class="score" id="score0"></b></div><div class="versus"><b>FINAL</b><span id="game"></span></div><div class="team right"><img id="logo1"><div class="identity"><small id="status1"></small><h1 id="name1"></h1></div><b class="score" id="score1"></b></div></header><div class="series"><span id="serieslabel"></span><em id="seriesvalue"></em></div><div class="table"><div id="names" class="grid names"></div><div id="rows"></div></div><footer class="foot"><span>ESTADÍSTICAS DEL PARTIDO</span><b id="footnote"></b><div class="credit"><strong id="appversion">v1.2</strong><span>Aplicación desarrollada por Bruno Reboredo Álvarez</span><span id="preview"></span></div></footer></section></div><style id="customstyle"></style>
<script src="/overlay-visibility.js"></script><script>
const $=id=>document.getElementById(id),stage=$('stage'),preview=new URLSearchParams(location.search).has('preview');
if(preview)document.body.classList.add('preview');
const visibility=new OverlayVisibility(stage);
function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.width=innerWidth/scale+"px";stage.style.height=innerHeight/scale+"px";stage.style.transform=`scale(${scale})`}onresize=resize;resize();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog=[]; const defaults=['Score','Goals','Assists','Shots','Saves','BoostUsed'];
function stat(p,k){const v=p?.[k];return v!==null&&v!==undefined&&Number.isFinite(Number(v))?Math.max(0,Number(v)):null}
let last='';
function render(s){const result=s.postmatch;if(!result||result.visible!==true){visibility.hide();last='';return}visibility.show();
 const key=JSON.stringify([result,s.config,catalog]);if(last===key)return;last=key;
 const c=result.config,m=result.match,theme=s.config;for(const [k,v] of Object.entries(theme.colors))stage.style.setProperty('--'+k,v);stage.style.color=theme.colors.text;stage.style.fontFamily=theme.font;stage.style.setProperty('--overlay-opacity',theme.opacity/100);stage.classList.remove('angular','rounded','classic');stage.classList.add(theme.design||'angular');$('customstyle').textContent=theme.custom_css||'';
 $('event').textContent=c.event;$('round').textContent=c.round;$('game').textContent=`PARTIDO ${c.game} · BO${c.bestof}`;
 for(let t=0;t<2;t++){$('name'+t).textContent=c.teams[t].name;$('score'+t).textContent=m.scores[t];$('status'+t).textContent=result.winner===t?'VICTORIA':'EQUIPO '+(t+1);const logo=$('logo'+t);logo.src=c.teams[t].logo||'/assets/torneo.png';logo.classList.toggle('hidden',!c.show_logos)}
 const wins=result.wins||c.teams.map(t=>t.wins),tied=wins[0]===wins[1],leader=wins[0]>wins[1]?0:1,complete=Math.max(...wins)>=Math.floor(c.bestof/2)+1||wins[0]+wins[1]>=c.bestof;
 $('serieslabel').textContent=tied?(complete?'SERIE EMPATADA':'EMPATE EN LA SERIE'):`${c.teams[leader].name} ${complete?'GANA LA SERIE':'LIDERA LA SERIE'}`;$('seriesvalue').textContent=wins.join(' — ');
 const scope=s.config.stats_scope||'match', data=result.statistics?.[scope], shown=data?.[0]||m.players; const metrics=(s.config.metrics||defaults).map(k=>catalog.find(item=>item.key===k)).filter(Boolean); const teams=[0,1].map(t=>shown.filter(p=>p.TeamNum===t).sort((a,b)=>(a.Shortcut??0)-(b.Shortcut??0)).slice(0,3));const teamSize=Math.max(1,...teams.map(team=>team.length));stage.style.setProperty('--team-size',teamSize);teams.forEach(p=>{while(p.length<teamSize)p.push(null)});
 const all=teams.flat(),scores=all.map(p=>stat(p,'Score')),max=Math.max(...scores.filter(v=>v!==null)),bestScore=Math.max(...m.players.map(p=>stat(p,'Score')??0)), bestRaw=m.players.filter(p=>stat(p,'Score')===bestScore),best=bestScore>0&&bestRaw.length===1?all.find(p=>p.Name===bestRaw[0].Name&&p.TeamNum===bestRaw[0].TeamNum):null;
 function cell(p,t){return `<div class="player ${t?'right':''} ${p&&p===best?'top':''}" title="${esc(p?.Name||'Sin jugador')}">${p&&p===best?'<span class="award">MVP</span>':''}${esc(p?.Name||'—')}</div>`}
 $('names').innerHTML=teams[0].map(p=>cell(p,0)).join('')+'<div class="label">JUGADORES</div>'+teams[1].map(p=>cell(p,1)).join('');

 const mode=s.config.team_mode||'total',compact=metrics.length<6;
 $('rows').classList.toggle('compact',compact);
 function formatted(value,metric){if(value===null||value===undefined)return '—';if(typeof value==='string')return esc(value);if(metric.unit==='sí/no')return value>0?'SÍ':'NO';return Number(value.toFixed(1)).toLocaleString('es-ES')+(metric.unit==='%'?'%':'')}
 $('rows').innerHTML=metrics.map(metric=>{const k=metric.key,values=teams.map(team=>team.map(p=>p?.[k]??null)),nums=values.flat().filter(v=>typeof v==='number'),peak=Math.max(0,...nums),raw=data?.[1]?.map(t=>t[k]??null)||values.map(v=>v.every(n=>n===null)?null:v.reduce((a,b)=>a+(typeof b==='number'?b:0),0));
 let total=[...raw];const valid=total.every(v=>typeof v==='number'&&Number.isFinite(v));
 if(valid){if(mode==='mean'&&metric.aggregate==='sum')total=total.map((v,t)=>v/Math.max(1,teams[t].filter(Boolean).length));else if(mode==='difference')total=[raw[0]-raw[1],raw[1]-raw[0]];else if(mode==='share')total=raw[0]+raw[1]>0?raw.map(v=>100*v/(raw[0]+raw[1])):[null,null]}
 const known=valid&&raw.every(v=>v>=0),share=known&&raw[0]+raw[1]>0?100*raw[0]/(raw[0]+raw[1]):50;
 const cells=t=>values[t].map(v=>`<div class="value ${typeof v==='string'?'textvalue':''}">${compact&&typeof v==='number'?`<i class="player-fill ${t?'right':''}" style="width:${peak>0?100*Math.max(0,v)/peak:0}%"></i>`:''}<span>${formatted(v,metric)}</span></div>`).join('');
 const totals=metric.unit==='texto'?'':total.map(v=>formatted(v,mode==='share'?{...metric,unit:'%'}:metric)).join(' / ');
 return `<div class="grid row">${cells(0)}<div class="label">${esc(metric.label.toUpperCase())}${metric.unit&& !['%','texto','sí/no','puesto'].includes(metric.unit)?`<small>${esc(metric.unit)}</small>`:''}<div class="compare" style="--share:${share}%;${known?'':'visibility:hidden'}"><i></i><b></b></div><small>${totals}</small></div>${cells(1)}</div>`}).join('');
 const period={match:'PARTIDO',series:'SERIE',tournament:'TORNEO'}[scope];
 document.querySelector('.foot > span').textContent='ESTADÍSTICAS · '+period;
 $('appversion').textContent='v'+(s.app?.version||'0.8.0').replace(/\.0$/,'');$('footnote').textContent='— = SIN DATOS';$('preview').textContent=preview?'VISTA PREVIA · DATOS DE EJEMPLO':'';
}
async function poll(){try{if(!catalog.length){const definitions=await fetch('/metrics',{cache:'no-store'});catalog=await definitions.json()}const r=await fetch(preview?'/preview-state?players='+(new URLSearchParams(location.search).get('players')||'3'):'/state',{cache:'no-store'});if(r.ok)render(await r.json())}catch(e){}setTimeout(poll,250)}poll();
</script></html>
